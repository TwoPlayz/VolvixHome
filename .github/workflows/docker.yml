# Builds the Docker image and publishes it to GitHub's container registry:
#   ghcr.io/<you>/volvix-home:latest   (pull it from your NAS / server)
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Server tests
        run: cargo test --manifest-path server/Cargo.toml

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/volvix-home" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: arm64 is built by emulation here and takes 10x longer. For a Raspberry Pi / ARM NAS, change this to
          # linux/amd64,linux/arm64 (and expect a long first build).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
