# Keeps the Actions history tidy: monthly (or when you press Run workflow) it deletes finished runs older than 30 days,
# always keeping the 10 newest. It only touches workflow runs, never code, releases or images.
name: Tidy Actions history
on:
  schedule: [{ cron: "0 4 1 * *" }]
  workflow_dispatch:
permissions:
  actions: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100" \
            --jq ".workflow_runs | sort_by(.created_at) | reverse | .[10:] | .[] | select(.created_at < \"$cutoff\") | .id" |
          while read -r id; do
            echo "deleting run $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
          done
