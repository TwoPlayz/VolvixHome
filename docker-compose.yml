# Volvix Home next to Lidarr. Both see the same music folder:
#   Lidarr imports into it, Volvix Home streams from it (read-only).
#
#   1. Change the paths under "volumes" to your music and downloads folders.
#   2. docker compose up -d
#   3. Open http://<server>:4747 and create the admin account. Add your household under Account → Household.
#   4. Open Lidarr at http://<server>:8686 and set its root folder to /music.
#   5. In Volvix Home: Settings → Lidarr, paste Lidarr's API key (Lidarr → Settings → General), then copy the
#      webhook URL it shows into Lidarr → Settings → Connect → Webhook (On Release Import).
services:
  volvix-home:
    image: ghcr.io/twoplayz/volvix-home:latest   # or build it yourself: comment this out and keep "build"
    build: .
    container_name: volvix-home
    ports:
      - "4747:4747"
    environment:
      - VH_RESCAN_MINUTES=15        # how often to look for new music (Lidarr's webhook makes it instant)
      - VH_LIDARR_URL=http://lidarr:8686
      # - VH_LIDARR_API_KEY=...     # or paste it in the app: Settings → Lidarr
      # search is powered by MusicBrainz (musicbrainz.org); set VH_MUSICBRAINZ_URL only for a mirror
    volumes:
      - ./config/volvix-home:/data  # accounts, playlists, settings
      - /path/to/music:/music:ro    # your music library
    user: "1000:1000"               # match the owner of your music folder
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/lidarr:/config
      - /path/to/music:/music
      - /path/to/downloads:/downloads
    ports:
      - "8686:8686"
    restart: unless-stopped
