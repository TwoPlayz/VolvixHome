<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Shared with you · Volvix</title>
<style>
  :root { --bg:#121214; --surface:#1c1c20; --hover:#26262b; --text:#f5f5f7; --text2:#a1a1aa; --accent:#e5484d; color-scheme: dark light; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f6f8; --surface:#fff; --hover:#ececf0; --text:#18181b; --text2:#62626b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; min-height:100vh; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 140px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-.02em; margin-bottom:20px; }
  .brand svg { width:26px; height:26px; }
  header { display:flex; gap:18px; align-items:flex-end; margin-bottom:18px; }
  .art { width:132px; height:132px; flex:none; border-radius:10px; background:linear-gradient(135deg,#5e548e,#e5484d); display:grid; place-items:center; overflow:hidden; box-shadow:0 8px 28px rgba(0,0,0,.35); }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text2); }
  h1 { margin:2px 0 6px; font-size:28px; line-height:1.1; letter-spacing:-.02em; }
  .meta { color:var(--text2); font-size:14px; }
  .playall { margin:6px 0 14px; display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 20px; border:0; border-radius:999px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  ol { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer; }
  li:hover { background:var(--hover); }
  li.on { color:var(--accent); }
  li .n { width:22px; text-align:center; color:var(--text2); font-variant-numeric:tabular-nums; }
  li .t { flex:1; min-width:0; } li .t b { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } li .t span { color:var(--text2); font-size:13px; }
  li .d { color:var(--text2); font-size:13px; font-variant-numeric:tabular-nums; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid rgba(128,128,128,.2); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width:720px; margin:0 auto; display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; }
  .bar .now { min-width:0; } .bar .now b { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .bar .now span { color:var(--text2); font-size:13px; }
  .ctrls { display:flex; gap:6px; } .ctrls button { width:40px; height:40px; border-radius:50%; border:0; background:transparent; color:var(--text); cursor:pointer; display:grid; place-items:center; }
  .ctrls button:hover { background:var(--hover); } .ctrls .pp { background:var(--text); color:var(--bg); }
  .seek { grid-column:1 / -1; height:5px; border-radius:3px; background:rgba(128,128,128,.35); cursor:pointer; position:relative; }
  .seek i { position:absolute; inset:0 auto 0 0; width:0; border-radius:3px; background:var(--text); }
  .gone { text-align:center; padding:80px 16px; color:var(--text2); } .gone h1 { color:var(--text); }
  button:focus-visible, li:focus-visible, .seek:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  var token = location.pathname.split('/').filter(Boolean).pop();
  var app = document.getElementById('app'), audio = new Audio(), tracks = [], cur = -1;
  var ICON = { play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>', pause: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>', next: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM17 5h2v14h-2z"/></svg>', prev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 5l-9 7 9 7zM5 5h2v14H5z"/></svg>' };
  var LOGO = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#E5484D"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#000" stroke-opacity=".22"/><circle cx="16" cy="16" r="3.5" fill="#111"/></svg>';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(sec) { sec = Math.max(0, Math.round(sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  function left(exp, now) { var d = Math.max(0, exp - now), days = Math.round(d / 86400 * 10) / 10 >= 1 ? Math.round(d / 86400) : 0; return days >= 1 ? days + ' day' + (days > 1 ? 's' : '') : Math.max(1, Math.round(d / 3600)) + ' hours'; }

  fetch('/api/share/' + encodeURIComponent(token)).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Not found'); return j; }); }).then(show).catch(function (e) {
    app.innerHTML = '<div class="brand">' + LOGO + 'Volvix</div><div class="gone"><h1>This link isn\'t available</h1><p>' + esc(e.message) + '</p></div>';
  });

  function show(s) {
    tracks = s.tracks; document.title = s.name + ' · Volvix';
    var cover = tracks.length && tracks[0].cover ? '<img alt="" src="/api/share/' + token + '/cover/' + tracks[0].albumId + '">' : '';
    app.innerHTML = '<div class="brand">' + LOGO + 'Volvix</div>' +
      '<header><div class="art">' + cover + '</div><div><div class="eyebrow">' + esc(s.kind) + ' shared by ' + esc(s.by) + '</div><h1>' + esc(s.name) + '</h1><div class="meta">' + tracks.length + ' song' + (tracks.length === 1 ? '' : 's') + ' · link works for ' + left(s.expires, s.serverNow) + ' more</div></div></header>' +
      '<button class="playall" id="all">' + ICON.play + 'Play</button>' +
      '<ol>' + tracks.map(function (t, i) { return '<li tabindex="0" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span class="t"><b>' + esc(t.title) + '</b><span>' + esc(t.artist) + '</span></span><span class="d">' + fmt(t.duration) + '</span></li>'; }).join('') + '</ol>' +
      '<div class="bar" id="bar" hidden><div class="in"><div class="now"><b id="nt"></b><span id="na"></span></div><div class="ctrls"><button id="pv" aria-label="Previous">' + ICON.prev + '</button><button id="pp" class="pp" aria-label="Play or pause">' + ICON.play + '</button><button id="nx" aria-label="Next">' + ICON.next + '</button></div><div class="seek" id="sk" role="slider" tabindex="0" aria-label="Seek"><i id="sf"></i></div></div></div>';
    document.getElementById('all').onclick = function () { go(0); };
    app.querySelectorAll('li').forEach(function (li) { li.onclick = function () { go(+li.dataset.i); }; li.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(+li.dataset.i); } }; });
    document.getElementById('pp').onclick = function () { audio.paused ? audio.play() : audio.pause(); };
    document.getElementById('nx').onclick = function () { go(cur + 1); }; document.getElementById('pv').onclick = function () { go(Math.max(0, cur - 1)); };
    var sk = document.getElementById('sk');
    sk.onclick = function (e) { var r = sk.getBoundingClientRect(); if (audio.duration) audio.currentTime = audio.duration * (e.clientX - r.left) / r.width; };
    sk.onkeydown = function (e) { if (e.key === 'ArrowRight') audio.currentTime += 10; else if (e.key === 'ArrowLeft') audio.currentTime -= 10; else return; e.preventDefault(); };
  }
  function go(i) {
    if (i < 0 || i >= tracks.length) return;
    cur = i; var t = tracks[i];
    audio.src = '/api/share/' + token + '/stream/' + encodeURIComponent(t.id); audio.play().catch(function () {});
    document.getElementById('bar').hidden = false; document.getElementById('nt').textContent = t.title; document.getElementById('na').textContent = t.artist;
    app.querySelectorAll('li').forEach(function (li, k) { li.classList.toggle('on', k === i); });
    if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album || '' }); } catch (e) {} }
  }
  audio.addEventListener('ended', function () { go(cur + 1); });
  audio.addEventListener('play', function () { var b = document.getElementById('pp'); if (b) b.innerHTML = ICON.pause; });
  audio.addEventListener('pause', function () { var b = document.getElementById('pp'); if (b) b.innerHTML = ICON.play; });
  audio.addEventListener('timeupdate', function () { var f = document.getElementById('sf'); if (f && audio.duration) f.style.width = (audio.currentTime / audio.duration * 100) + '%'; });
})();
</script>
</body>
</html>
