<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Volvix</title>
  <meta name="description" content="Volvix Home: your household's own music server.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23E5484D'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23000' stroke-opacity='.22'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23111'/%3E%3C/svg%3E">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="css/styles.css">
  <!-- first paint in the device's theme (the default); a saved Dark/Light choice is applied by js/store.js -->
  <script>try { if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}</script>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-mark"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#E5484D"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#000" stroke-opacity=".22"/><circle cx="16" cy="16" r="3.5" fill="#111"/></svg></div>
    <div class="splash-word">Volvix</div>
  </div>
  <div id="app"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="js/config.js"></script>
  <!-- boot.js signs you in (or sets up a new server), loads your library, then loads the rest of the app -->
  <script src="js/boot.js"></script>
</body>
</html>
