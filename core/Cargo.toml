[package]
name = "volvix-core"
version = "0.1.0"
edition = "2021"
description = "Shared by the native Volvix Home apps: server client, sign-in, library, search, play queue, cover cache."
publish = false

[lib]
name = "volvix_core"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
unicode-normalization = "0.1"
