[package]
name = "volvix-home-app"
version = "0.1.0"
edition = "2021"
description = "Volvix Home for Windows: a desktop window onto your Volvix Home server."
publish = false

[[bin]]
name = "volvix-home"
path = "src/main.rs"

# The native app (no web view), in progress. Built only with --features native, so the release
# build of today's app is unchanged:  cargo run --features native --bin volvix-home-native
[[bin]]
name = "volvix-home-native"
path = "src/native/main.rs"
required-features = ["native"]

[features]
native = ["dep:volvix-core", "dep:iced", "dep:rodio", "dep:tokio", "dep:souvlaki", "dep:raw-window-handle", "dep:windows", "dep:rfd", "dep:image"]

[dependencies]
wry = "0.57"
tao = "0.37"
serde_json = "1"
dirs = "5"
tray-icon = "0.19"
winreg = "0.52"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

# native app only
volvix-core = { path = "../../core", optional = true }
iced = { version = "0.13.1", optional = true, features = ["image", "svg", "tokio", "advanced", "lazy"] }
rodio = { version = "0.20.1", optional = true, default-features = false, features = ["symphonia-all"] }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "time"] }
souvlaki = { version = "0.8", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# asks Windows whether this connection is metered (the same version wry already uses)
windows = { version = "0.62", optional = true, features = ["Networking_Connectivity", "Win32_UI_Shell"] }
# picking a picture file, and shaping it into a round profile picture
rfd = { version = "0.15", optional = true, default-features = false }
image = { version = "0.24", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }

[build-dependencies]
winres = "0.1"

# Sound is decoded and equalised live inside the audio callback, so the code has to be fast: optimise for speed, not size.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Test builds (cargo run) stay quick enough that the sound does not stutter.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
