[package]
name = "volvix-home"
version = "0.25.0"
edition = "2021"
description = "Volvix Home: a self-hosted music server for your household. Streams your own library (e.g. the folder Lidarr fills)."
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "signal", "sync", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
notify = "6"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
